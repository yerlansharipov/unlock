<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Әскери баспана · 50/50</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #010409; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: #f0f6fc; }
  .card { max-width: 560px; margin: 0 auto; background: #0d1117; border: 1px solid #30363d; border-radius: 20px; padding: 24px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: #9198a1; margin: 4px 0 20px; }
  .track { position: relative; margin-top: 30px; }
  .key-date { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .bar { display: flex; gap: 3px; height: 24px; border-radius: 99px; overflow: hidden; }
  .key { position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(-45deg); font-size: 18px; line-height: 1; filter: drop-shadow(3px 0 0 #0d1117) drop-shadow(-3px 0 0 #0d1117) drop-shadow(0 3px 0 #0d1117) drop-shadow(0 -3px 0 #0d1117); /* обод 3px, как зазор в .bar; цвет фона карточки */ }
  .steps { margin-top: 20px; }
  .item { display: grid; grid-template-columns: 22px 1fr; column-gap: 12px; padding: 10px 0; border-top: 1px solid #21262d; }
  .item:first-child { border-top: 0; }
  .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; color: #0d1117; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .when { font-size: 14px; color: #f0f6fc; opacity: .8; }
  .hint { font-size: 14px; color: #9198a1; }
  .need { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .need span { font-size: 13px; border: 1px solid #30363d; border-radius: 99px; padding: 2px 10px; }
  .need .ok { background: rgba(63, 185, 80, .35); border-color: transparent; color: #fff; }
</style>
</head>
<body>
<div class="card" id="card"></div>

<script>
// ===== Данные клиента — меняйте только этот блок =====
const client = {
  program: "Әскери баспана",  // официальное название программы
  home: "Дом",                // Дом / Квартира
  price: 25000000,            // цена жилья, ₸
  savings: 4000000,           // уже на депозите Отбасы, ₸
  depositOpened: "2017-01",   // когда открыт депозит (ГГГГ-ММ)
  monthly: 537000,            // сколько откладывать в месяц, ₸
  notBefore: "",              // раньше нельзя подать заявку; "" если нет
  applyNeeds: ["В списке «Әскери баспана» от работодателя"], // что еще нужно для заявки
  keysNeeds: ["Дом подходит банку в залог"], // что еще нужно для ключей
  dealMonths: 1,             // от заявки до ключей, мес (примерно)
  years: 25,                  // срок займа
};
// =====================================================

const TODAY = new Date(2026, 10, 1);
const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
const mln = n => (n / 1e6).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " млн ₸";
const k = n => Math.round(n / 1000) + " тыс ₸";
const ym = s => { const [y, m] = s.split("-").map(Number); return new Date(y, m - 1, 1); };
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const MONTHS_FULL = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const dur = m => [Math.floor(m / 12) ? Math.floor(m / 12) + " г" : "", m % 12 ? m % 12 + " мес" : ""].filter(Boolean).join(" ");
const fmt = d => MONTHS[d.getMonth()] + " " + d.getFullYear();
const pay = (sum, rate) => { const r = rate / 12; return sum * r / (1 - Math.pow(1 + r, -client.years * 12)); };

const half = client.price / 2;
const gap = Math.max(0, half - client.savings);
const ready = new Date(Math.max(
  addMonths(TODAY, Math.ceil(gap / client.monthly)),
  addMonths(ym(client.depositOpened), 36),
  client.notBefore ? ym(client.notBefore) : 0
));
const keys = addMonths(ready, client.dealMonths);
const loan = client.price - Math.max(client.savings, half);
const saveMonths = (ready.getFullYear() - TODAY.getFullYear()) * 12 + ready.getMonth() - TODAY.getMonth();

const depositOk = addMonths(ym(client.depositOpened), 36) <= TODAY;

// [цвет, месяцев на шаг (ширина полосы), шаг, срок, пояснение, условия шага: [текст, выполнено?]]
const steps = [
  ["#f0b400", saveMonths, gap ? "Копить до " + mln(half) : "Ждать", MONTHS_FULL[ready.getMonth()] + " " + ready.getFullYear() + " · " + dur(saveMonths) + (gap ? " · " + k(client.monthly) + "/мес" : ""), gap ? "" : "Раньше " + fmt(ready) + " подать нельзя", [
    [mln(client.savings), true],
  ]],
  ["#2f6fed", client.dealMonths, "Подать заявку и получить ключи 🔑", "", "Заём — " + mln(loan) + " · 5%", [
    [mln(half), !gap],
    ["ОП 16", false],
    ["Депозиту от 3 лет", depositOk],
    ...client.applyNeeds.map(t => [t, false]),
    ...client.keysNeeds.map(t => [t, false]),
  ]],
  ["#e5484d", client.years * 12, "Оплачивать ипотеку", client.years + " лет · до " + (keys.getFullYear() + client.years) + " · " + k(pay(loan, 0.05)) + "/мес", "", []],
];
const width = months => 1 + Math.log2(1 + months); // примерно по времени, но короткие шаги видны
const widths = steps.map(s => width(s[1]));
const keyFrac = (widths[0] + widths[1]) / widths.reduce((a, b) => a + b); // ключи — конец шага 2
const GAP = 3; // px, как в .bar
const keyLeft = `calc((100% - ${GAP * (steps.length - 1)}px) * ${keyFrac} + ${GAP * 1.5}px)`; // середина зазора между шагами 2 и 3

document.getElementById("card").innerHTML = `
  <h1>${client.program} · жилищный заём 50/50</h1>
  <p class="sub">${client.home} ${mln(client.price)}</p>
  <div class="track">
    <div class="key" style="left:${keyLeft}" title="Ключи: ${fmt(keys)}">🔑</div>
    <div class="key-date" style="left:${keyLeft}">${MONTHS_FULL[keys.getMonth()]} ${keys.getFullYear()}</div>
    <div class="bar">${steps.map(([c], i) => `<span style="background:${c}; flex:${widths[i]}"></span>`).join("")}</div>
  </div>
  <div class="steps">${steps.map(([c, m, what, when, hint, needs], i) => `
    <div class="item">
      ${needs.length ? `<div class="need">${needs.map(([t, ok]) => `<span class="${ok ? "ok" : ""}">${t}</span>`).join("")}</div>` : ""}
      <span class="dot" style="background:${c}">${i + 1}</span>
      <div><b>${what}</b>${when ? `<div class="when">${when}</div>` : ""}${hint ? `<div class="hint">${hint}</div>` : ""}</div>
    </div>`).join("")}
  </div>
`;
</script>
</body>
</html>
